site_name: AstrortsA 的学习笔记
site_url: https://astrortsa.github.io/
site_description: 学习笔记与资料分享

theme:
  name: material
  language: zh
  font:
    text: "STHeiti Light"
    code: "Consolas"
  features:
    - navigation.instant
    - navigation.tabs
    - toc.integrate
    - search.suggest
  palette:
    - scheme: default
      primary: purple
      accent: indigo

nav:
  - 首页: index.md
  - 学习笔记: notes.md

# 这些原稿保留在仓库中，但不生成网站页面或进入站内搜索。
exclude_docs: |
  /resume.md
  /research.md
  /share.md
  /study/

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
