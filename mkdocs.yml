site_name: AstrortsA 的学习笔记
site_url: https://astrortsa.github.io/
site_description: 学习笔记与资料分享

theme:
  name: material
  language: zh
  font:
    text: "STHeiti Light"
    code: "Consolas"
  features:
    - navigation.instant
    - navigation.tabs
    - toc.integrate
    - search.suggest
  palette:
    - scheme: default
      primary: purple
      accent: indigo

nav:
  - 首页: index.md
  - 学习笔记:
    - 课程总览: notes.md
    - 大一: courses/year1.md
    - 大二: courses/year2.md
    - 大三: courses/year3.md
    - 大四: courses/year4.md

# 这些原稿保留在仓库中，但不生成网站页面或进入站内搜索。
exclude_docs: |
  /resume.md
  /research.md
  /share.md
  /study/

# 资料预览页通过课程名称进入，不单独占用课程导航。
not_in_nav: |
  /courses/quantum-mechanics-review.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
